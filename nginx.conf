# ============================================================================
# Nginx Configuration - MARS Frontend & API Proxy
# ============================================================================
# Serves React SPA with client-side routing
# Proxies /api calls to FastAPI backend
# Optimized for production with caching, compression, and security headers
# ============================================================================

# Run Nginx as non-root user (already in Alpine image)
user nginx;

# Auto-detect number of CPU cores for optimal performance
worker_processes auto;

# Maximum number of open file descriptors
worker_rlimit_nofile 65535;

# Error log
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# ──────────────────────────────────────────────────────────────────────────
events {
  worker_connections 2048;
  use epoll;                    # Efficient multiplexing on Linux
  multi_accept on;              # Accept multiple connections per worker
}

# ──────────────────────────────────────────────────────────────────────────
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ────────────────────────────────────────────────────────────────────────
  # Logging Configuration
  # ────────────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  # ────────────────────────────────────────────────────────────────────────
  # Performance Optimizations
  # ────────────────────────────────────────────────────────────────────────
  
  # Send files efficiently using sendfile() syscall
  sendfile on;
  
  # Don't buffer data, send immediately
  tcp_nopush on;
  tcp_nodelay on;
  
  # Connection timeouts
  keepalive_timeout 65;
  client_max_body_size 10M;    # Max upload size 10MB

  # Buffer sizes for headers
  client_header_buffer_size 1k;
  large_client_header_buffers 4 8k;
  
  # Hash tables
  types_hash_max_size 2048;

  # ────────────────────────────────────────────────────────────────────────
  # Compression - Reduce transfer size by 70-80%
  # ────────────────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;         # Don't compress < 1KB
  gzip_types text/plain
             text/css
             text/js
             text/xml
             text/javascript
             application/javascript
             application/x-javascript
             application/json
             application/xml+rss
             application/rss+xml
             image/svg+xml;
  gzip_comp_level 6;            # Compression level 1-9
  gzip_disable "msie6";         # Disable for old IE

  # ────────────────────────────────────────────────────────────────────────
  # Caching - Browser cache control
  # ────────────────────────────────────────────────────────────────────────
  # Note: These are defaults, can be overridden per location block
  
  # Map for cache duration based on file type
  map $sent_http_content_type $expires {
    default                    off;
    text/html                  epoch;           # Never cache HTML (SPA routing)
    text/css                   max;             # Cache CSS indefinitely
    application/javascript     max;             # Cache JS indefinitely
    ~image/                    max;             # Cache images indefinitely
    application/x-font-truetype  max;           # Cache fonts indefinitely
    ~font/                     max;             # Cache fonts indefinitely
  }

  expires $expires;

  # ────────────────────────────────────────────────────────────────────────
  # Rate Limiting - Prevent abuse
  # ────────────────────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;

  # ────────────────────────────────────────────────────────────────────────
  # Upstream Backends (DISABLED for Render - frontend makes direct API calls)
  # ────────────────────────────────────────────────────────────────────────
  # For local docker-compose development, uncomment the backend upstream below
  # For Render/production, frontend makes direct calls to backend via REACT_APP_BACKEND_URL
  # upstream backend_api {
  #   server backend:8000;        # Docker service hostname
  #   keepalive 32;               # Connection pool size
  # }

  # ────────────────────────────────────────────────────────────────────────
  # HTTP Server - Redirect to HTTPS (Optional - commented out for dev)
  # ────────────────────────────────────────────────────────────────────────
  # Uncomment for production with SSL
  # server {
  #   listen 80;
  #   server_name _;
  #   return 301 https://$host$request_uri;
  # }

  # ────────────────────────────────────────────────────────────────────────
  # Main Server Block
  # ────────────────────────────────────────────────────────────────────────
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _;
    
    # Root directory for serving files
    root /usr/share/nginx/html;
    
    # Default file to serve
    index index.html;

    # ─────────────────────────────────────────────────────────────────────
    # Security Headers
    # ─────────────────────────────────────────────────────────────────────
    
    # Prevent clickjacking attacks
    add_header X-Frame-Options "SAMEORIGIN" always;
    
    # Enable XSS protection
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Referrer policy
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Permissions policy (replaces Feature-Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # ─────────────────────────────────────────────────────────────────────
    # Static Files - HTML, CSS, JS, Images
    # ─────────────────────────────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
      # Cache static assets for 1 year
      expires 1y;
      add_header Cache-Control "public, immutable";
      access_log off;           # Don't log static file requests
    }

    # ─────────────────────────────────────────────────────────────────────
    # API Proxy - DISABLED for Render (frontend makes direct API calls)
    # ─────────────────────────────────────────────────────────────────────
    # Uncomment for docker-compose local development
    # location /api/ {
    #   limit_req zone=api_limit burst=20 nodelay;
    #   proxy_pass http://backend_api;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host $host;
    #   proxy_set_header X-Real-IP $remote_addr;
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_set_header X-Forwarded-Host $server_name;
    #   proxy_set_header Connection "";
    #   proxy_connect_timeout 60s;
    #   proxy_send_timeout 60s;
    #   proxy_read_timeout 60s;
    #   proxy_buffering on;
    #   proxy_buffer_size 8k;
    #   proxy_buffers 8 8k;
    #   add_header Cache-Control "no-cache, no-store, must-revalidate";
    #   expires -1;
    # }

    # ─────────────────────────────────────────────────────────────────────
    # Backend Health Check Endpoint - DISABLED for Render
    # ─────────────────────────────────────────────────────────────────────
    # Uncomment for docker-compose local development
    # location /health {
    #   proxy_pass http://backend_api;
    #   proxy_http_version 1.1;
    #   proxy_set_header Connection "";
    #   access_log off;
    # }

    # ─────────────────────────────────────────────────────────────────────
    # Backend Docs Endpoint (OpenAPI/Swagger) - DISABLED for Render
    # ─────────────────────────────────────────────────────────────────────
    # Uncomment for docker-compose local development
    # location /docs {
    #   proxy_pass http://backend_api;
    #   proxy_http_version 1.1;
    #   proxy_set_header Connection "";
    #   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # }

    # location /redoc {
    #   proxy_pass http://backend_api;
    #   proxy_http_version 1.1;
    #   proxy_set_header Connection "";
    # }

    # location /openapi.json {
    #   proxy_pass http://backend_api;
    #   proxy_http_version 1.1;
    #   proxy_set_header Connection "";
    # }

    # ─────────────────────────────────────────────────────────────────────
    # React SPA Routing - Fallback to index.html
    # ─────────────────────────────────────────────────────────────────────
    # This allows React Router to handle all non-API routes
    # When user navigates to /research, /report, etc., return index.html
    # React Router then handles the routing on the client side
    location / {
      limit_req zone=general_limit burst=50 nodelay;
      
      # Try to serve the file directly
      try_files $uri $uri/ /index.html;
      
      # Don't cache HTML files (SPA routing)
      add_header Cache-Control "no-cache, no-store, must-revalidate";
      expires -1;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Deny Access to Sensitive Files
    # ─────────────────────────────────────────────────────────────────────
    location ~ /\. {
      deny all;
      access_log off;
      log_not_found off;
    }

    # ─────────────────────────────────────────────────────────────────────
    # Error Pages
    # ─────────────────────────────────────────────────────────────────────
    error_page 404 /index.html;        # 404 → index.html (for SPA routing)
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}

# ============================================================================
# PRODUCTION DEPLOYMENT NOTES
# ============================================================================
#
# 1. UPSTREAM DIRECTIVE:
#    upstream backend_api {
#      server backend:8000;
#    }
#    - Defines backend service location via Docker hostname
#    - Relies on docker-compose network service discovery
#    - Will fail if backend service name differs
#
# 2. SPA ROUTING:
#    try_files $uri $uri/ /index.html;
#    - React Router works with this setup
#    - All non-matching routes return index.html
#    - Client-side React Router then handles navigation
#    - Enables deep linking: /research, /report, /metrics URLs work
#
# 3. PROXY HEADERS:
#    X-Real-IP, X-Forwarded-For, X-Forwarded-Proto
#    - Backend can extract original client info from headers
#    - Important for logging and analytics
#    - Required if backend rate limits or logs client IPs
#
# 4. RATE LIMITING:
#    limit_req: Prevents DOS attacks
#    - API endpoints: 10req/s with 20 burst
#    - General routes: 30req/s with 50 burst
#    - Adjust for your expected load
#
# 5. SSL/TLS:
#    Currently not configured (commented section)
#    For production:
#    - Use reverse proxy with Let's Encrypt
#    - Uncomment HTTP→HTTPS redirect
#    - Configure with certbot or similar
#    - Or place behind cloud CDN (Cloudflare, AWS CloudFront, etc.)
#
# 6. PERFORMANCE:
#    - gzip reduces bandwidth 70-80%
#    - sendfile uses kernel for efficiency
#    - Keep-alive reduces connection overhead
#    - Static assets cached by browser for 1 year
#
# ============================================================================
